[project]
name = "redco-credit-v1"
version = "0.1.0"
description = "Restricted deterministic credit probes for ReDCO Stage C."
requires-python = ">=3.12"
dependencies = ["redco", "verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redco_credit_v1"]
