[project]
name = "redco-rlm-trace-v1"
version = "0.1.0"
description = "Small native verifiers.v1 tasks for auditing RLM trace coverage."
requires-python = ">=3.12"
dependencies = ["verifiers"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redco_rlm_trace_v1"]
