max_steps = 75
seq_len = 512

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3-4B-Instruct-2507"

[file_monitor]
filename = "metrics.jsonl"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64

[trainer.optim]
lr = 1e-5

[orchestrator]
batch_size = 16
group_size = 8
max_inflight_rollouts = 8
max_off_policy_steps = 0

[orchestrator.algo]
type = "grpo"

[orchestrator.train.sampling]
temperature = 0.7
max_completion_tokens = 64

[[orchestrator.train.env]]
name = "redco-credit"
env.id = "redco-credit-v1"
env.taskset = { id = "redco-credit-v1", repeats_per_probe = 128, exogenous_seed_offset = 1000 }
env.branching_enabled = false
env.branch_temperature = 2.0
env.context.harness = { id = "null", runtime = { type = "subprocess" } }
env.original.harness = { id = "null", runtime = { type = "subprocess" } }

[orchestrator.eval]
interval = 5
num_examples = 32

[orchestrator.eval.sampling]
temperature = 0.0
max_completion_tokens = 64

[[orchestrator.eval.env]]
name = "redco-credit-eval"
env.id = "redco-credit-v1"
env.taskset = { id = "redco-credit-v1", repeats_per_probe = 4, exogenous_seed_offset = 9000 }
env.branching_enabled = false
env.branch_temperature = 2.0
env.context.harness = { id = "null", runtime = { type = "subprocess" } }
env.original.harness = { id = "null", runtime = { type = "subprocess" } }

[ckpt]
interval = 5
keep_last = 2

[trainer.ckpt]
weights_only = true
skip_gather_master_weights = true

[inference]
gpu_memory_utilization = 0.7
seed = 72026

[inference.model]
max_model_len = 512

[weight_broadcast]
type = "filesystem"
