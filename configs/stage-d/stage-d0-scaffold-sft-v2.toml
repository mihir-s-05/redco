max_steps = 8
output_dir = "runs/stage-d0/scaffold-sft-v2"
clean_output_dir = true

[deployment]
type = "single_node"
num_gpus = 1
gpus_per_node = 2

[model]
name = "/workspace/models/qwen3-4b-instruct-2507-cdbee75"
seq_len = 2048
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
optim_cpu_offload = false

[model.ac]
freq = 1

[model.lora]
rank = 32
alpha = 64

[renderer]
name = "prime-qwen3"

[data]
type = "sft"
name = "json"
data_files = "datasets/stage-d/scaffold-sft-v2.jsonl"
seq_len = 2048
batch_size = 8
micro_batch_size = 1
shuffle = false
seed = 7402001

[optim]
type = "adamw"
lr = 5e-6
weight_decay = 0
max_norm = 1

[scheduler]
type = "constant"

[ckpt]
interval = 2
weights_only = true
keep_last = 4

[ckpt.weights]
adapter_only = true
save_format = "safetensors"

[file_monitor]
filename = "metrics.jsonl"
